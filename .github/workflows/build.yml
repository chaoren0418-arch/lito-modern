name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LiTo381-Modern
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LiTo381-Modern
      - name: cargo check
        run: cargo check --locked --all-targets
      - name: GUI window probe self-test (pure logic, no window access)
        run: python -X utf8 ../維護工具/owned-gui-window-probe.py --self-test
      - name: resource matrix tool self-test (pure logic, no client resources)
        run: python -X utf8 ../維護工具/resource-matrix/resource_matrix.py --self-test
      - name: cargo test (lib, no GUI)
        run: cargo test --locked --lib --no-fail-fast
